spring:
  application:
    name: karmancos-identity
  profiles:
    default: local
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/karmancosid}
      database: ${MONGODB_DATABASE:karmancosid}
      auto-index-creation: ${MONGODB_CREATE_INDEXES:false}
  session:
    timeout: 30m
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ${KARMANCOS_SESSION_COOKIE_NAME:KARMANCOSID}
        path: /
        http-only: true
        secure: ${KARMANCOS_SECURE_COOKIES:false}
        same-site: lax

karmancos:
  issuer: ${KARMANCOS_ISSUER:http://localhost:4321}
  public-base-url: ${KARMANCOS_PUBLIC_BASE_URL:${KARMANCOS_ISSUER:http://localhost:4321}}
  mail-from: ${KARMANCOS_MAIL_FROM:no-reply@karmancos.com}
  security:
    secure-cookies: ${KARMANCOS_SECURE_COOKIES:false}

logging:
  level:
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: prod
karmancos:
  security:
    secure-cookies: true
