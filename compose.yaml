name: karmancos-id

services:
  identity:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-karmancosid}
      MONGODB_CREATE_INDEXES: ${MONGODB_CREATE_INDEXES:-true}
      KARMANCOS_ISSUER: ${KARMANCOS_ISSUER:-http://localhost}
      KARMANCOS_PUBLIC_BASE_URL: ${KARMANCOS_PUBLIC_BASE_URL:-${KARMANCOS_ISSUER:-http://localhost}}
      KARMANCOS_MAIL_FROM: ${KARMANCOS_MAIL_FROM:-no-reply@karmancos.com}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      KARMANCOS_SECURE_COOKIES: ${KARMANCOS_SECURE_COOKIES:-false}
      KARMANCOS_SESSION_COOKIE_NAME: ${KARMANCOS_SESSION_COOKIE_NAME:-KARMANCOSID}
      KARMANCOS_KEY_DIRECTORY: /data/keys
      KARMANCOS_PRIVATE_KEY_PATH: ${KARMANCOS_PRIVATE_KEY_PATH:-}
      KARMANCOS_PUBLIC_KEY_PATH: ${KARMANCOS_PUBLIC_KEY_PATH:-}
      KARMANCOS_SUBJECT_HMAC_SECRET: ${KARMANCOS_SUBJECT_HMAC_SECRET:-}
      KARMANCOS_BOOTSTRAP_ADMIN_EMAIL: ${KARMANCOS_BOOTSTRAP_ADMIN_EMAIL:-}
      KARMANCOS_BOOTSTRAP_ADMIN_PASSWORD: ${KARMANCOS_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - identity_data:/data

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - identity
    environment:
      CADDY_SITE: ${CADDY_SITE:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  identity_data:
  caddy_data:
  caddy_config:
