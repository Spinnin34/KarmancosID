name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      PUBLIC_IDENTITY_ISSUER: https://id.example.test
      KARMANCOS_ISSUER: https://id.example.test
      KARMANCOS_SUBJECT_HMAC_SECRET: ci-only-subject-key-not-for-production
      KARMANCOS_SECURE_COOKIES: "false"
      MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: Check SDK JavaScript syntax
        working-directory: .
        run: node --check sdk/index.js
